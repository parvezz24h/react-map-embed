name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: Library (Node ${{ matrix.node }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        react: [19]
        include:
          - node: 22
            react: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use React ${{ matrix.react }}
        if: matrix.react != 19
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - run: npm pack --dry-run

  nextjs-example:
    name: Next.js example builds against the packed library
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack library
        working-directory: examples/nextjs-app
        run: npm run pack-lib
      - name: Install example
        working-directory: examples/nextjs-app
        run: npm install
      - name: Build example
        working-directory: examples/nextjs-app
        run: npm run build
